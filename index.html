<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .picture-button {
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .picture-button:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Select a Canteen</h1>
    <div class="button-container">
        <button class="picture-button">Canteen 1</button>
        <button class="picture-button">Canteen 2</button>
        <button class="picture-button">Canteen 3</button>
    </div>
</body>
</html>
